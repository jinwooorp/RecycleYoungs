# Backend가 재생성되어도 Docker DNS에서 새 주소를 확인한다.
upstream recycleyoungs_backend {
    zone recycleyoungs_backend 64k;
    resolver 127.0.0.11 valid=10s ipv6=off;
    server backend:8080 resolve;
}

# /assets/는 Vite가 생성한 해시 파일 전용이다. SPA는 새 배포 시 HTML을 재검증한다.
map $uri $static_cache_control {
    default "";
    /index.html "no-cache";
    ~^/assets/ "public, max-age=31536000, immutable";
}

server {
    listen 8080 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Cache-Control $static_cache_control;

    # /api와 /api/ 하위 요청은 경로·쿼리 및 Backend 응답 상태를 그대로 전달한다.
    location ~ ^/api(?:/|$) {
        proxy_pass http://recycleyoungs_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_intercept_errors off;
    }

    location ~ (^|/)\. {
        return 404;
    }

    # 정적 파일 요청이 실패하면 SPA 문서 대신 404를 반환한다.
    location ~ ^/assets(?:/|$)|\.[^/]+$ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
