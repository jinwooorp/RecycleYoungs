upstream recycleyoungs_backend {
    zone recycleyoungs_backend 64k;
    # Docker DNS로 Backend 컨테이너 재생성 후에도 새 주소를 확인합니다.
    resolver 127.0.0.11 valid=10s ipv6=off;
    server backend:8080 resolve;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    location ~ ^/api(?:/|$) {
        # 경로와 쿼리를 그대로 전달해 Backend가 상태 코드와 응답을 결정합니다.
        proxy_pass http://recycleyoungs_backend;
        proxy_set_header Host $http_host;
    }

    location /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}
