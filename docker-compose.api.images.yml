# Selected only for NEW environments initialized from a verified image manifest.
# Compose >=2.24.4 is required for !override. Existing homes use api.yml alone.
x-runtime: &runtime
  image: ${API_WORKER_IMAGE:?}
  platform: linux/amd64
  volumes: !override
    - ${API_HOME:?}/data:/api-data
    - ${API_HOME}/target.json:/api-control/target.json:ro
    - ${API_HOME}/writer-password:/api-control/writer-password:ro
    - ${API_HOME}/reader-password:/api-control/reader-password:ro
    - ${API_KEY_FILE:?}:/api-control/api.env:ro

services:
  api-postgres:
    image: ${API_DATABASE_IMAGE:?}
    environment:
      POSTGRES_PASSWORD: !reset null
      POSTGRES_PASSWORD_FILE: /run/secrets/owner-password
    volumes:
      - ${API_HOME}/owner-password:/run/secrets/owner-password:ro
  api-scheduler:
    <<: *runtime
  api-bootstrap:
    <<: *runtime
    volumes: !override
      - ${API_HOME}/data:/api-data
      - ${API_HOME}/target.json:/api-control/target.json:ro
      - ${API_HOME}/owner-password:/api-control/owner-password:ro
      - ${API_HOME}/writer-password:/api-control/writer-password:ro
      - ${API_HOME}/reader-password:/api-control/reader-password:ro
      - ${API_KEY_FILE}:/api-control/api.env:ro
  api-backend:
    image: ${API_BACKEND_IMAGE:?}
    platform: linux/amd64
    volumes: !override
      - ${API_HOME}/target.json:/api-control/target.json:ro
      - ${API_HOME}/reader-password:/api-control/reader-password:ro
