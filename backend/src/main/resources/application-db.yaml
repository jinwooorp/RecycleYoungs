# 서비스 조회용 풀과 Flyway 전용 연결은 같은 DB 설정을 사용하되 별도로 구성한다.
# 환경변수는 실행 셸에서 전달하며 Spring Boot가 .env 파일을 자동으로 읽지는 않는다.
spring:
  datasource:
    url: ${DB_JDBC_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
    url: ${DB_JDBC_URL}
    user: ${DB_USER}
    password: ${DB_PASSWORD}
