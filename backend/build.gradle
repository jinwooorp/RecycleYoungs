plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
description = 'backend'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.1'
    compileOnly 'org.projectlombok:lombok'
    runtimeOnly 'org.postgresql:postgresql'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
    useJUnitPlatform()
}

// bootJar/production retain application.yaml. Ordinary local bootRun is fail-closed team-dev only.
tasks.named('bootRun') {
    doFirst {
        def forbidden = System.getenv().findAll { key, value -> value &&
            (key.startsWith('DB_') || key.startsWith('PG') || key.startsWith('FLYWAY_') || key.startsWith('SPRING_')) }
        if (!forbidden.isEmpty() || !getArgs().isEmpty()) {
            throw new GradleException('bootRun rejects ambient DB/Spring settings and CLI overrides. Use a clean shell for team-dev.')
        }
        def captured = providers.exec {
            workingDir rootProject.projectDir.parentFile
            commandLine 'python3', 'etl/team_dev.py', 'backend-proof'
        }.standardOutput.asText.get()
        def proof = new groovy.json.JsonSlurper().parseText(captured)
        ['sid', 'owner', 'contract', 'password', 'version', 'spatial'].each { key -> environment 'TEAM_DEV_' + key.toUpperCase(), proof[key] }
        systemProperty 'spring.profiles.active', 'team-dev'
        systemProperty 'spring.flyway.enabled', 'false'
        logger.lifecycle('TEAM_DEV_IDENTITY_READY: reader on 127.0.0.1:55432/recycleyoungs_team_dev; migrations disabled')
    }
}

// Documentation preview only: loopback, mocked JdbcClient, DataSource/Flyway excluded.
tasks.register('swaggerPreview', JavaExec) {
    description = 'Serve Swagger on 127.0.0.1:18080 without a database (documentation only)'
    group = 'documentation'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.example.backend.openapi.OpenApiPreview'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
}

sourceSets {
    dbTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

configurations {
    dbTestImplementation.extendsFrom testImplementation
    dbTestRuntimeOnly.extendsFrom testRuntimeOnly
}

tasks.register('dbTest', Test) {
    description = 'Run opt-in smoke tests against an actual PostgreSQL database'
    group = 'verification'
    testClassesDirs = sourceSets.dbTest.output.classesDirs
    classpath = sourceSets.dbTest.runtimeClasspath
    useJUnitPlatform()
    // DB state and environment can change without changes to the test classes.
    outputs.upToDateWhen { false }
    outputs.cacheIf { false }
}

// Explicitly packaged opt-in harness; never runs with test, check, bootRun or dbTest.
sourceSets {
    locationIntegration {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
configurations {
    locationIntegrationImplementation.extendsFrom implementation
    locationIntegrationRuntimeOnly.extendsFrom runtimeOnly
}
tasks.register('prepareLocationIntegration', Sync) {
    dependsOn tasks.named('locationIntegrationClasses')
    into layout.buildDirectory.dir('location-integration')
    from(sourceSets.main.output) { into 'classes' }
    from(sourceSets.locationIntegration.output) { into 'classes' }
    from(configurations.locationIntegrationRuntimeClasspath) { into 'lib' }
}

// Disposable real-data demo only; ordinary application/test entry points do not invoke it.
sourceSets {
    demo {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
configurations {
    demoImplementation.extendsFrom implementation
    demoRuntimeOnly.extendsFrom runtimeOnly
}
tasks.register('prepareDemo', Sync) {
    dependsOn tasks.named('demoClasses')
    into layout.buildDirectory.dir('demo')
    from(sourceSets.main.output) { into 'classes' }
    from(sourceSets.demo.output) { into 'classes' }
    from(configurations.demoRuntimeClasspath) { into 'lib' }
}
