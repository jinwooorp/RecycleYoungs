plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.2'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'com.diffplug.spotless' version '8.10.4'
}

group = 'kr.ac.recycleyoungs'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-flyway'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-jdbc'
	implementation 'org.flywaydb:flyway-database-postgresql'
	runtimeOnly 'org.postgresql:postgresql'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	testImplementation 'org.testcontainers:testcontainers-postgresql'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Docker가 필요한 통합 테스트를 일반 단위 테스트와 분리하고 애플리케이션 출력을 함께 사용한다.
sourceSets {
	// CLI·내보내기는 제품 JAR에서 분리한다. 공통 결합 검증과 안전 읽기는 main에서 공유한다.
	scoreRegression {
		compileClasspath += sourceSets.main.output
		runtimeClasspath += sourceSets.main.output
	}
	test {
		compileClasspath += sourceSets.scoreRegression.output
		runtimeClasspath += sourceSets.scoreRegression.output
	}
	integrationTest {
		compileClasspath += sourceSets.main.output + sourceSets.scoreRegression.output
		runtimeClasspath += sourceSets.main.output + sourceSets.scoreRegression.output
	}
}

// 통합 테스트에서도 기존 테스트 라이브러리와 런타임 의존성을 재사용한다.
configurations {
	scoreRegressionImplementation.extendsFrom implementation
	scoreRegressionRuntimeOnly.extendsFrom runtimeOnly
	integrationTestImplementation.extendsFrom testImplementation
	integrationTestRuntimeOnly.extendsFrom testRuntimeOnly
}

// test/build/check는 이 작업을 실행하지 않는다. JDBC 인증정보는 환경변수로만 전달한다.
tasks.register('scoreRegression', JavaExec) {
	description = 'Runs opt-in read-only score regression diagnostics against the configured development DB.'
	group = 'verification'
	classpath = sourceSets.scoreRegression.runtimeClasspath
	mainClass = 'kr.ac.recycleyoungs.score.ScoreRegressionMain'
	doFirst {
		if (System.getenv('SCORE_REGRESSION_ENABLED') != '1') {
			throw new GradleException('SCORE_REGRESSION_ENABLED=1 명시가 필요합니다. DB에는 연결하지 않았습니다.')
		}
	}
}

// 파일 저장·DB 조회는 별도 CLI에서만 한다. 일반 test/build/check에 연결하지 않는다.
tasks.register('scoreSnapshotExport', JavaExec) {
	description = 'Exports an opt-in read-only district/dong snapshot bundle outside the repository.'
	group = 'verification'
	classpath = sourceSets.scoreRegression.runtimeClasspath
	mainClass = 'kr.ac.recycleyoungs.score.ScoreSnapshotExportMain'
	systemProperty 'score.snapshot.repositoryRoot', rootProject.projectDir.parentFile.canonicalPath
	doFirst {
		if (System.getenv('SCORE_SNAPSHOT_EXPORT_ENABLED') != '1') {
			throw new GradleException('SCORE_SNAPSHOT_EXPORT_ENABLED=1 명시가 필요합니다. DB·파일 접근 없음.')
		}
	}
}

tasks.register('scoreSnapshotVerify', JavaExec) {
	description = 'Verifies one explicitly selected snapshot bundle without DB or Spring Context.'
	group = 'verification'
	classpath = sourceSets.scoreRegression.runtimeClasspath
	mainClass = 'kr.ac.recycleyoungs.score.ScoreSnapshotVerifyMain'
	systemProperty 'score.snapshot.repositoryRoot', rootProject.projectDir.parentFile.canonicalPath
	doFirst {
		if (!System.getenv('SCORE_SNAPSHOT_INPUT_PATH')) {
			throw new GradleException('SCORE_SNAPSHOT_INPUT_PATH 명시가 필요합니다.')
		}
	}
}

// 독립 기대 해시를 필수로 받는 오프라인 진단이다. 공개 API·일반 build에는 연결하지 않는다.
tasks.register('scoreTrustPreflight', JavaExec) {
	description = 'Runs opt-in offline trust/manifest/snapshot binding diagnostics without granting publication approval.'
	group = 'verification'
	classpath = sourceSets.scoreRegression.runtimeClasspath
	mainClass = 'kr.ac.recycleyoungs.score.ScoreTrustPreflightMain'
	systemProperty 'score.snapshot.repositoryRoot', rootProject.projectDir.parentFile.canonicalPath
}

tasks.named('test') {
	useJUnitPlatform()
}

// 제품 JAR에 내부 검증은 포함하되 CLI·DB 회귀·파일 출력 도구가 섞이면 빌드를 거부한다.
tasks.register('verifyScorePackaging') {
	group = 'verification'
	def archives = [tasks.named('jar'), tasks.named('bootJar')]
	dependsOn archives
	inputs.files(archives.collect { it.flatMap { task -> task.archiveFile } })
	doLast {
		archives.each { archive ->
			new java.util.zip.ZipFile(archive.get().archiveFile.get().asFile).withCloseable { zip ->
				def classes = zip.entries().collect { it.name.replaceFirst('^BOOT-INF/classes/', '') }
				def prefix = 'kr/ac/recycleyoungs/score/'
				def required = ['ScoreTrustVerification', 'ScoreTrustRecordVerifier', 'ScoreApprovalManifestVerifier', 'ScoreTrustRecordCodec', 'ScoreSnapshotBundle', 'ScoreSnapshotFiles']
				if (!required.every { classes.contains(prefix + it + '.class') }
						|| classes.any { it ==~ /(?:BOOT-INF\/classes\/)?kr\/ac\/recycleyoungs\/score\/(?:ScoreRegression.*|Score.*Main(?:\$.*)?|ScoreSnapshotOutput(?:\$.*)?)\.class/ }) {
					throw new GradleException('점수 내부 검증/CLI 제품 JAR 분리 실패')
				}
			}
		}
	}
}

tasks.named('check') {
	dependsOn tasks.named('verifyScorePackaging')
}

// 일반 build와 별도로 명시해 실행하며 Testcontainers용 Docker가 실행 중이어야 한다.
tasks.register('integrationTest', Test) {
	description = 'Runs PostgreSQL/PostGIS integration tests. Requires Docker.'
	group = 'verification'
	testClassesDirs = sourceSets.integrationTest.output.classesDirs
	classpath = sourceSets.integrationTest.runtimeClasspath
	useJUnitPlatform()
	shouldRunAfter tasks.named('test')
}

spotless {
	java {
		target 'src/**/*.java'
		googleJavaFormat('1.35.0')
	}
}
