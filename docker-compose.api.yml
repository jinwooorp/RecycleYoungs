name: recycleyoungs-api-dev

x-worker: &worker
  image: sha256:9d57711a7d8a613845eb4c78b57331a7f612087ab965c0b0a85d1569a5cec5c4
  pull_policy: never
  user: "${API_UID:?}:${API_GID:?}"
  working_dir: /workspace/etl
  read_only: true
  tmpfs:
    - /tmp
    - /api-control:uid=${API_UID},gid=${API_GID},mode=0700
  labels:
    org.recycleyoungs.api-owner: ${API_OWNER:?}
  environment:
    PYTHONDONTWRITEBYTECODE: "1"
    PYTHONUNBUFFERED: "1"
  networks: [data, access]
  entrypoint: [python, /workspace/etl/api_worker.py]
  volumes: &worker-volumes
    - ${API_CODE_ROOT:?}/etl/app:/workspace/etl/app:ro
    - ${API_CODE_ROOT}/etl/api_runtime.py:/workspace/etl/api_runtime.py:ro
    - ${API_CODE_ROOT}/etl/api_worker.py:/workspace/etl/api_worker.py:ro
    - ${API_CODE_ROOT}/etl/api_snapshot.py:/workspace/etl/api_snapshot.py:ro
    - ${API_CODE_ROOT}/etl/team_public_data.py:/workspace/etl/team_public_data.py:ro
    - ${API_CODE_ROOT}/etl/team_data.py:/workspace/etl/team_data.py:ro
    - ${API_CODE_ROOT}/etl/demo_worker.py:/workspace/etl/demo_worker.py:ro
    - ${API_CODE_ROOT}/etl/demo_safety.py:/workspace/etl/demo_safety.py:ro
    - ${API_CODE_ROOT}/data/manifest.json:/workspace/data/manifest.json:ro
    - ${API_CODE_ROOT}/data/public-data-v2.json:/workspace/data/public-data-v2.json:ro
    - ${API_CODE_ROOT}/backend/src/main/resources/db/migration:/workspace/backend/src/main/resources/db/migration:ro
    - ${API_CODE_ROOT}/backend/src/main/resources/db/api-runtime:/api-schema:ro
    - ${API_HOME:?}/data:/api-data
    - ${API_HOME}/target.json:/api-control/target.json:ro
    - ${API_HOME}/writer-password:/api-control/writer-password:ro
    - ${API_HOME}/reader-password:/api-control/reader-password:ro
    - ${API_KEY_FILE:?}:/api-control/api.env:ro

services:
  api-postgres:
    image: postgis/postgis@sha256:44126d872ac91993766c341e369c539e8196614321765d36a6f1bab0419a5fa5
    platform: linux/amd64
    pull_policy: never
    restart: unless-stopped
    labels:
      org.recycleyoungs.api-owner: ${API_OWNER}
    environment:
      POSTGRES_DB: recycleyoungs_api_dev
      POSTGRES_USER: ry_api_owner
      POSTGRES_PASSWORD: ${API_DB_PASSWORD:-}
      PGDATA: /var/lib/postgresql/data/api
    networks: [data]
    volumes:
      - api_db:/var/lib/postgresql/data
    tmpfs: [/docker-entrypoint-initdb.d]

  api-bootstrap:
    <<: *worker
    profiles: [tools]
    command: [bootstrap]
    restart: "no"
    volumes:
      - ${API_HOME}/owner-password:/api-control/owner-password:ro
      # The inherited worker list is repeated through Compose !override-free includes below.
      - ${API_CODE_ROOT}/etl/app:/workspace/etl/app:ro
      - ${API_CODE_ROOT}/etl/api_runtime.py:/workspace/etl/api_runtime.py:ro
      - ${API_CODE_ROOT}/etl/api_worker.py:/workspace/etl/api_worker.py:ro
      - ${API_CODE_ROOT}/etl/api_snapshot.py:/workspace/etl/api_snapshot.py:ro
      - ${API_CODE_ROOT}/etl/team_public_data.py:/workspace/etl/team_public_data.py:ro
      - ${API_CODE_ROOT}/etl/team_data.py:/workspace/etl/team_data.py:ro
      - ${API_CODE_ROOT}/etl/demo_worker.py:/workspace/etl/demo_worker.py:ro
      - ${API_CODE_ROOT}/etl/demo_safety.py:/workspace/etl/demo_safety.py:ro
      - ${API_CODE_ROOT}/data/manifest.json:/workspace/data/manifest.json:ro
      - ${API_CODE_ROOT}/data/public-data-v2.json:/workspace/data/public-data-v2.json:ro
      - ${API_CODE_ROOT}/backend/src/main/resources/db/migration:/workspace/backend/src/main/resources/db/migration:ro
      - ${API_CODE_ROOT}/backend/src/main/resources/db/api-runtime:/api-schema:ro
      - ${API_HOME}/data:/api-data
      - ${API_HOME}/target.json:/api-control/target.json:ro
      - ${API_HOME}/writer-password:/api-control/writer-password:ro
      - ${API_HOME}/reader-password:/api-control/reader-password:ro
      - ${API_KEY_FILE}:/api-control/api.env:ro

  api-scheduler:
    <<: *worker
    command: [schedule]
    restart: unless-stopped

  api-backend:
    image: sha256:5be18367a9b3979a9f37234c371b80da457a448fb9577bd94d4bf24d923fafac
    pull_policy: never
    user: "${API_UID}:${API_GID}"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
      - /api-control:uid=${API_UID},gid=${API_GID},mode=0700
    labels:
      org.recycleyoungs.api-owner: ${API_OWNER}
    entrypoint: [java, -jar, /service/backend.jar]
    environment:
      SPRING_PROFILES_ACTIVE: api-dev
    networks: [data, access]
    ports: ["127.0.0.1:18090:8080"]
    volumes:
      - ${API_CODE_ROOT}/backend/build/libs/backend-0.0.1-SNAPSHOT.jar:/service/backend.jar:ro
      - ${API_HOME}/target.json:/api-control/target.json:ro
      - ${API_HOME}/reader-password:/api-control/reader-password:ro

networks:
  data:
    name: recycleyoungs-api-dev-data
    internal: true
    labels:
      org.recycleyoungs.api-owner: ${API_OWNER}
  access:
    name: recycleyoungs-api-dev-access
    labels:
      org.recycleyoungs.api-owner: ${API_OWNER}
volumes:
  api_db:
    name: recycleyoungs-api-dev-db
    labels:
      org.recycleyoungs.api-owner: ${API_OWNER}
