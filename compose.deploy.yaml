name: recycleyoungs-deploy

services:
  frontend:
    build:
      context: ./frontend
      args:
        VITE_KAKAO_MAP_APP_KEY: ${DEPLOY_KAKAO_MAP_APP_KEY:-}
    ports:
      - "127.0.0.1:${DEPLOY_HTTP_PORT:-8080}:8080"
    volumes:
      - type: bind
        source: ./nginx/default.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      - backend
    networks:
      - edge
      - app
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: db
      # 셸의 DB_JDBC_URL과 관계없이 이 Compose의 DB 서비스에만 연결한다.
      DB_JDBC_URL: jdbc:postgresql://db:5432/${DEPLOY_DB_NAME:?Set DEPLOY_DB_NAME in .env.deploy}
      DB_USER: ${DEPLOY_DB_USER:?Set DEPLOY_DB_USER in .env.deploy}
      DB_PASSWORD: ${DEPLOY_DB_PASSWORD:?Set DEPLOY_DB_PASSWORD in .env.deploy}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app
      - data
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  db:
    image: postgis/postgis:17-3.5
    # 기존 검증과 같은 판본을 사용한다. ARM64 호스트에서는 AMD64 에뮬레이션이 필요하다.
    platform: linux/amd64
    environment:
      POSTGRES_DB: ${DEPLOY_DB_NAME:?Set DEPLOY_DB_NAME in .env.deploy}
      POSTGRES_USER: ${DEPLOY_DB_USER:?Set DEPLOY_DB_USER in .env.deploy}
      POSTGRES_PASSWORD: ${DEPLOY_DB_PASSWORD:?Set DEPLOY_DB_PASSWORD in .env.deploy}
    volumes:
      - deploy_postgres_data:/var/lib/postgresql/data
    networks:
      - data
    healthcheck:
      # 초기화 중 Unix 소켓으로만 수신하는 임시 서버를 준비 완료로 판단하지 않는다.
      test:
        [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

networks:
  edge:
  app:
    internal: true
  data:
    internal: true

volumes:
  deploy_postgres_data:
