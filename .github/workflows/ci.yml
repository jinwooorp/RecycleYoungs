name: CI

on:
  push:
    branches: [project-upgrade]
  pull_request:
    branches: [project-upgrade]
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CI: "true"

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Set npm version
        run: |
          npm install --global npm@11.19.1
          node --version
          npm --version
          test "$(node -p 'process.versions.node.split(".")[0]')" = 24
          test "$(npm --version)" = 11.19.1
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  backend:
    name: Backend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            backend/*.gradle
            backend/gradle/wrapper/gradle-wrapper.properties
      - run: java -version
      - run: ./gradlew --no-daemon --console=plain test
      - run: ./gradlew --no-daemon --console=plain spotlessCheck
      # build의 check에 기존 verifyScorePackaging이 포함된다.
      - run: ./gradlew --no-daemon --console=plain build

  backend-integration:
    name: Backend integration
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            backend/*.gradle
            backend/gradle/wrapper/gradle-wrapper.properties
      - name: Check Docker and prepare the test image
        run: |
          docker version --format '{{.Server.Version}}'
          docker info --format 'Docker driver={{.Driver}}'
          docker pull postgis/postgis:17-3.5
      - run: ./gradlew --no-daemon --console=plain integrationTest
      # Docker 사용 불가 등에 따른 테스트 건너뜀도 성공으로 처리하지 않는다.
      - name: Require executed integration tests without skips
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          reports = list(Path('build/test-results/integrationTest').glob('TEST-*.xml'))
          if not reports:
              raise SystemExit('Integration test reports are missing.')
          totals = dict.fromkeys(('tests', 'failures', 'errors', 'skipped'), 0)
          for report in reports:
              root = ET.parse(report).getroot()
              for key in totals:
                  totals[key] += int(root.attrib[key])
          print('Integration test results:', totals)
          if totals['tests'] == 0 or any(totals[key] for key in ('failures', 'errors', 'skipped')):
              raise SystemExit('Integration tests must execute without failures, errors, or skips.')
          PY

  etl:
    name: ETL
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: etl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: etl/.nvmrc
          cache: npm
          cache-dependency-path: etl/package-lock.json
      - name: Set npm version
        run: |
          npm install --global npm@11.19.1
          node --version
          npm --version
          test "$(node -p 'process.versions.node.split(".")[0]')" = 24
          test "$(npm --version)" = 11.19.1
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
