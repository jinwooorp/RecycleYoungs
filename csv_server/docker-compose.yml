version: '3.8'

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: recycle_db
    restart: unless-stopped

    environment:
      POSTGRES_DB: recycle_analysis
      POSTGRES_USER: recycle
      POSTGRES_PASSWORD: recycle
    
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: